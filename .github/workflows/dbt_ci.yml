name: dbt CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: ./ci
  BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
  BIGQUERY_KEYFILE_JSON: ${{ secrets.BIGQUERY_KEYFILE_JSON }}

jobs:
  build:
    name: Build and test models
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Kept separate and non-fatal on purpose: sqlfluff-templater-dbt pins its
      # own dbt-core range and can refuse to resolve against a newer adapter.
      # A linter that will not install must not take the build down with it.
      - name: Install lint tooling
        continue-on-error: true
        run: pip install sqlfluff sqlfluff-templater-dbt

      - name: Write service account keyfile
        run: |
          mkdir -p ci
          echo "$BIGQUERY_KEYFILE_JSON" > ci/keyfile.json

      - name: Write CI profile
        run: |
          cat > ci/profiles.yml <<'PROFILE'
          thelook_analytics:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account
                project: "{{ env_var('BIGQUERY_PROJECT') }}"
                dataset: "dbt_ci_{{ env_var('GITHUB_RUN_ID', 'local') }}"
                keyfile: ci/keyfile.json
                threads: 8
                location: US
                timeout_seconds: 600
                priority: interactive
          PROFILE

      - name: Install packages
        run: dbt deps

      - name: Lint SQL
        run: sqlfluff lint models --dialect bigquery --templater dbt
        continue-on-error: true

      - name: Validate project parses
        run: dbt parse

      - name: Check source freshness
        run: dbt source freshness
        continue-on-error: true

      - name: Build models and run all tests
        run: dbt build --fail-fast

      - name: Generate docs
        run: dbt docs generate

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/manifest.json
            target/catalog.json
            target/index.html

      # Requires bigquery.datasets.delete, which roles/bigquery.dataEditor does
      # NOT grant -- only dataOwner does. Non-fatal so a missing permission
      # cannot turn an otherwise-passing build red; see README for the fix.
      - name: Tear down CI dataset
        if: always()
        continue-on-error: true
        run: |
          pip install google-cloud-bigquery
          python - <<'PY'
          import os
          from google.cloud import bigquery
          os.environ["GOOGLE_APPLICATION_CREDENTIALS"] = "ci/keyfile.json"
          client = bigquery.Client(project=os.environ["BIGQUERY_PROJECT"])
          run_id = os.environ.get("GITHUB_RUN_ID", "local")
          prefix = f"dbt_ci_{run_id}"
          for ds in client.list_datasets():
              if ds.dataset_id.startswith(prefix):
                  client.delete_dataset(ds.reference, delete_contents=True, not_found_ok=True)
                  print("dropped", ds.dataset_id)
          PY
