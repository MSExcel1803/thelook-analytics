version: 2

sources:
  - name: thelook
    description: >
      Google's public simulated ecommerce dataset. Clothing retailer with users,
      web events, an order/order-item hierarchy, product catalogue, per-unit
      inventory and distribution centers. Read-only public data, so freshness is
      informational rather than actionable.
    database: bigquery-public-data
    schema: thelook_ecommerce

    # Source freshness: the generator appends new rows continuously.
    # `dbt source freshness` will warn if ingestion has visibly stalled.
    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 72, period: hour}
      loaded_at_field: created_at
    tables:
      - name: users
        description: One row per registered customer.
        columns:
          - name: id
            description: Primary key. Surrogate user id.
            tests: [unique, not_null]
          - name: email
            description: Customer email. Synthetic, but treated as PII downstream.
          - name: created_at
            description: Account registration timestamp (UTC).

      - name: orders
        description: One row per order header.
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: user_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook', 'users')
                    field: id
          - name: status
            tests:
              - accepted_values:
                  arguments:
                    values: ['Complete', 'Shipped', 'Processing', 'Cancelled', 'Returned']

      - name: order_items
        description: >
          One row per physical unit sold. This is the revenue grain — an order
          with num_of_item = 3 has three rows here.
        columns:
          - name: id
            tests: [unique, not_null]
          - name: order_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('thelook', 'orders')
                    field: order_id
          - name: product_id
            tests:
              - relationships:
                  arguments:
                    to: source('thelook', 'products')
                    field: id
          - name: sale_price
            description: Price actually paid for this unit, in USD.

      - name: products
        description: Product catalogue.
        columns:
          - name: id
            tests: [unique, not_null]

      - name: inventory_items
        description: >
          One row per physical unit ever stocked. Carries the true landed cost of
          the unit, which is what we use for margin (products.cost is a catalogue
          list cost and drifts from what was actually paid).
        columns:
          - name: id
            tests: [unique, not_null]

      - name: distribution_centers
        description: Warehouse locations.
        config:
          freshness:
          loaded_at_field:
        columns:
          - name: id
            tests: [unique, not_null]

      - name: events
        description: Clickstream events. Used for traffic-source attribution.
        columns:
          - name: id
            tests: [unique, not_null]
